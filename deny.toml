# cargo-deny: checks dependencies for security advisories, license
# compatibility, and untrusted sources. Run `make deny`.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# The app only builds for macOS.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
# Fail on any RustSec security advisory and on yanked versions. Unmaintained
# notices fail only for direct dependencies: transitive ones (bincode via
# syntect, paste via image) are for those crates' authors to replace.
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Permissive licenses, plus MPL-2.0 (option-ext, via dirs): its copyleft
# covers only that crate's own files if we modify them, which we don't.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[licenses.private]
# reviewer itself is `publish = false` and has no license of its own.
ignore = true

[bans]
# Duplicate versions come from the Dioxus and image trees, not from us.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
