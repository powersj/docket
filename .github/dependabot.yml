# Weekly update PRs, with minor and patch bumps grouped into one PR per
# ecosystem. Each release must be two weeks old first, so a compromised
# release has time to be caught and yanked.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: [minor, patch]
